<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Netflix – Ai đang xem?</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/profiles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
</head>
<body class="prf-page">

  <!-- Background -->
  <div class="prf-bg">
    <div class="prf-bg-gradient"></div>
  </div>

  <!-- Header -->
  <header class="prf-header">
    <a href="/" class="prf-logo">
      <svg viewBox="0 0 111 30" fill="#E50914" width="92" height="25">
        <path d="M105.06 0l-8.4 23.87L88.26 0H79.2l12.6 30-12.6 30h9.06l8.4-23.87L104.66 60h9.06L101.12 30 113.72 0h-8.66zM66.6 0v60h8.4V0H66.6zM51.6 0v60h8.4V0H51.6zM36.6 0v60h8.4V0H36.6zM0 0v60h8.4V0H0zM21.6 0v60h8.4V0H21.6z"/>
      </svg>
    </a>
  </header>

  <!-- Main -->
  <main class="prf-main">
    <div class="prf-container">
      <h1 class="prf-title" id="whoTitle">Ai đang xem?</h1>

      <!-- Profiles grid -->
      <div class="prf-grid" id="profilesGrid">
        <!-- Injected by JS -->
      </div>

      <button class="prf-btn-manage" id="manageBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        Quản lý hồ sơ
      </button>
    </div>
  </main>

  <!-- Cookie banner -->
  <div class="prf-cookie-banner" id="cookieBanner">
    <div class="prf-cookie-inner">
      <div class="prf-cookie-icon">🍪</div>
      <div class="prf-cookie-text">
        <strong>Cookie đã được thiết lập sau đăng nhập:</strong>
        <span id="cookieSummary">NetflixId, SecureNetflixId, flwssn, gsid, OTSessionTracking</span>
      </div>
      <button class="prf-cookie-close" onclick="document.getElementById('cookieBanner').style.display='none'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="/js/profiles.js"></script>
</body>
</html>
