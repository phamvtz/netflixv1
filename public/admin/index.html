<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Netflix v1</title>
  <link rel="stylesheet" href="/panel/css/tokens.css" />
  <link rel="stylesheet" href="/panel/css/components.css" />
</head>
<body data-theme="admin">
  <div class="panel-wrap">
    <div class="panel-login panel-card" id="loginCard">
      <h1>Admin đăng nhập</h1>
      <p class="sub">Quản lý seller, key và users demo.</p>
      <div id="acctLogin">
        <label class="panel-label">Username</label>
        <input id="username" type="text" class="panel-input" placeholder="admin" autocomplete="username" />
        <label class="panel-label">Mật khẩu</label>
        <input id="password" type="password" class="panel-input" placeholder="••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()" />
        <button class="panel-btn panel-btn--primary" onclick="login()">Đăng nhập</button>
        <p class="panel-alt">hoặc <a onclick="toggleTokenMode(true)">đăng nhập bằng token</a></p>
      </div>
      <div id="tokenLogin" class="hidden">
        <label class="panel-label">Admin token</label>
        <input id="token" type="password" class="panel-input" placeholder="token" onkeydown="if(event.key==='Enter')loginToken()" />
        <button class="panel-btn panel-btn--primary" onclick="loginToken()">Vào bằng token</button>
        <p class="panel-alt">hoặc <a onclick="toggleTokenMode(false)">đăng nhập bằng tài khoản</a></p>
      </div>
      <p class="panel-msg-err" id="loginErr"></p>
    </div>

    <div class="hidden" id="dash">
      <header class="panel-topbar">
        <div class="panel-brand"><span class="mark">●</span> Admin Dashboard</div>
        <nav class="panel-nav" id="panelNav">
          <a href="/checker">Checker</a>
          <a href="/" class="is-active">Admin</a>
        </nav>
        <div class="panel-actions">
          <button class="panel-btn panel-btn--sm panel-btn--ghost" onclick="loadAll()">↻ Tải lại</button>
          <button class="panel-btn panel-btn--sm" onclick="logout()">Đăng xuất</button>
        </div>
      </header>

      <div class="panel-stats" id="stats"></div>

      <section class="panel-card panel-card--warn hidden" id="pendingSec">
        <h2 class="panel-section-title">Seller chờ duyệt <span class="panel-pill panel-pill--hot" id="pendCount">0</span></h2>
        <div class="panel-table-wrap">
          <table class="panel-table">
            <thead><tr><th>Username</th><th>Email</th><th>Đăng ký</th><th></th></tr></thead>
            <tbody id="pendBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel-card">
        <h2 class="panel-section-title">Sellers <span class="panel-pill" id="sellerCount">0</span></h2>
        <div class="filter-bar" id="sellerFilterBar"></div>
        <div class="search-row">
          <input id="sellerSearch" type="search" class="panel-input panel-input--search" placeholder="Tìm username, email..." oninput="renderSellers()" />
        </div>
        <div class="panel-table-wrap">
          <table class="panel-table">
            <thead><tr><th>Username</th><th>Email</th><th>Trạng thái</th><th></th></tr></thead>
            <tbody id="sellersBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel-card">
        <h2 class="panel-section-title">Keys <span class="panel-pill" id="keyCount">0</span></h2>
        <div class="filter-bar" id="keyFilterBar"></div>
        <div class="search-row">
          <input id="keySearch" type="search" class="panel-input panel-input--search" placeholder="Tìm key, email, seller, ghi chú..." oninput="renderKeys()" />
        </div>
        <div class="panel-table-wrap">
          <table class="panel-table">
            <thead><tr><th>Key</th><th>Email</th><th>Seller</th><th>Dùng</th><th></th></tr></thead>
            <tbody id="keysBody"></tbody>
          </table>
        </div>
      </section>

      <section class="panel-card">
        <h2 class="panel-section-title">Users (Netflix demo)</h2>
        <div class="panel-table-wrap">
          <table class="panel-table">
            <thead><tr><th>ID</th><th>Email</th><th>Tên</th><th>Plan</th></tr></thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <div class="panel-toast" id="toast"></div>
  <script src="/panel/js/filters.js"></script>
  <script src="/admin/js/admin.js"></script>
</body>
</html>
