<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Netflix v1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0d0d12; color: #e5e5e5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 32px 24px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
    .brand { font-size: 1.3rem; font-weight: 800; color: #fff; }
    .brand span { color: #E50914; }
    .login-card {
      max-width: 360px; margin: 80px auto; background: #16161d;
      border: 1px solid #2a2a35; border-radius: 14px; padding: 28px;
    }
    .login-card h1 { font-size: 1.2rem; margin-bottom: 18px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 8px;
      border: 1.5px solid #2a2a35; background: #0d0d12; color: #fff;
      font-size: .95rem; outline: none; margin-bottom: 14px;
    }
    input:focus { border-color: #E50914; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #E50914; color: #fff; font-weight: 700; cursor: pointer; font-size: .95rem;
    }
    button:hover { background: #b20710; }
    .err { color: #f57e7e; font-size: .85rem; margin-top: 8px; display: none; }
    .dash { display: none; }
    .dash.show { display: block; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .stat { background: #16161d; border: 1px solid #2a2a35; border-radius: 12px; padding: 18px; }
    .stat-num { font-size: 1.8rem; font-weight: 900; color: #fff; }
    .stat-label { font-size: .78rem; color: #889; margin-top: 4px; }
    .section { background: #16161d; border: 1px solid #2a2a35; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .section h2 { font-size: 1rem; margin-bottom: 14px; color: #ccd; }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th { text-align: left; color: #889; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid #2a2a35; }
    td { padding: 8px 10px; border-bottom: 1px solid #1a1a22; color: #ccd; }
    td.mono { font-family: monospace; color: #7ecff5; }
    .btn-del { width: auto; padding: 4px 10px; background: #3a1a1a; color: #f57e7e; font-size: .72rem; border-radius: 6px; }
    .btn-del:hover { background: #5a2020; }
    .empty { color: #667; font-size: .85rem; padding: 12px; text-align: center; }
    .logout { width: auto; padding: 8px 16px; background: #2a2a35; font-size: .82rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Login -->
    <div class="login-card" id="loginCard">
      <h1>🔐 Admin đăng nhập</h1>
      <input id="token" type="password" placeholder="Admin token" />
      <button onclick="login()">Đăng nhập</button>
      <p class="err" id="loginErr"></p>
    </div>

    <!-- Dashboard -->
    <div class="dash" id="dash">
      <div class="topbar">
        <div class="brand"><span>●</span> Admin Dashboard</div>
        <button class="logout" onclick="logout()">Đăng xuất</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="section">
        <h2>Keys (<span id="keyCount">0</span>)</h2>
        <table>
          <thead><tr><th>Key</th><th>Email</th><th>Ghi chú</th><th>Lượt dùng</th><th></th></tr></thead>
          <tbody id="keysBody"></tbody>
        </table>
      </div>

      <div class="section">
        <h2>Users</h2>
        <table>
          <thead><tr><th>ID</th><th>Email</th><th>Tên</th><th>Plan</th></tr></thead>
          <tbody id="usersBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let TOKEN = sessionStorage.getItem('adminToken') || '';

    function authHeaders() { return { 'X-Admin-Token': TOKEN, 'Content-Type': 'application/json' }; }

    async function login() {
      const t = document.getElementById('token').value.trim();
      const err = document.getElementById('loginErr');
      err.style.display = 'none';
      try {
        const r = await fetch('/api/admin/stats', { headers: { 'X-Admin-Token': t } });
        if (r.status === 401) throw new Error('Token sai');
        if (!r.ok) throw new Error('Lỗi ' + r.status);
        TOKEN = t; sessionStorage.setItem('adminToken', t);
        showDash();
      } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
    }

    function logout() { sessionStorage.removeItem('adminToken'); TOKEN = ''; location.reload(); }

    async function showDash() {
      document.getElementById('loginCard').style.display = 'none';
      document.getElementById('dash').classList.add('show');
      await Promise.all([loadStats(), loadKeys(), loadUsers()]);
    }

    async function loadStats() {
      const d = await fetch('/api/admin/stats', { headers: authHeaders() }).then(r => r.json());
      const s = d.stats || {};
      const items = [
        ['Users', s.users], ['Profiles', s.profiles], ['Sessions', s.sessions],
        ['Content', s.content], ['Keys', s.keys], ['Keys đã dùng', s.keysUsed],
      ];
      document.getElementById('stats').innerHTML = items.map(([l, n]) =>
        `<div class="stat"><div class="stat-num">${n ?? 0}</div><div class="stat-label">${l}</div></div>`
      ).join('');
    }

    async function loadKeys() {
      const d = await fetch('/api/admin/keys', { headers: authHeaders() }).then(r => r.json());
      const keys = d.keys || [];
      document.getElementById('keyCount').textContent = keys.length;
      const body = document.getElementById('keysBody');
      if (!keys.length) { body.innerHTML = '<tr><td colspan="5" class="empty">Chưa có key</td></tr>'; return; }
      body.innerHTML = keys.map(k => `
        <tr>
          <td class="mono">${esc(k.key)}</td>
          <td>${esc(k.email)}</td>
          <td>${esc(k.note || '—')}</td>
          <td>${k.usedCount}</td>
          <td><button class="btn-del" onclick="delKey('${esc(k.key)}')">Xoá</button></td>
        </tr>`).join('');
    }

    async function loadUsers() {
      const d = await fetch('/api/admin/users', { headers: authHeaders() }).then(r => r.json());
      const users = d.users || [];
      document.getElementById('usersBody').innerHTML = users.map(u => `
        <tr><td class="mono">${esc(u.id)}</td><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(u.plan)}</td></tr>
      `).join('');
    }

    async function delKey(key) {
      if (!confirm('Xoá key ' + key + '?')) return;
      await fetch('/api/admin/keys/' + encodeURIComponent(key), { method: 'DELETE', headers: authHeaders() });
      await loadKeys(); await loadStats();
    }

    function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    // Auto-login nếu đã có token
    if (TOKEN) showDash();
  </script>
</body>
</html>
