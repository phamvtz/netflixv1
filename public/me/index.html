<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Netflix Code</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4ff 50%, #e8f5e9 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
    }
    .page { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }

    h1 { font-size: 1.4rem; font-weight: 700; color: #1a1a2e; margin-bottom: 6px; }
    .subtitle { font-size: .88rem; color: #666; line-height: 1.5; margin-bottom: 24px; }
    .subtitle strong { color: #1a1a2e; }

    /* Tabs */
    .tabs {
      display: flex;
      background: #f4f6fb;
      border-radius: 50px;
      padding: 4px;
      gap: 4px;
      margin-bottom: 20px;
    }
    .tab {
      flex: 1; padding: 9px 16px;
      border-radius: 50px;
      border: none; background: transparent;
      font-size: .85rem; font-weight: 600; color: #888;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 6px;
      transition: all .2s;
    }
    .tab.active { background: #2563eb; color: #fff; box-shadow: 0 2px 8px rgba(37,99,235,.3); }

    /* Label */
    .field-label { font-size: .82rem; font-weight: 600; color: #333; margin-bottom: 8px; }

    /* Input */
    .input-wrap {
      display: flex; align-items: center;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px; padding: 12px 14px;
      gap: 8px; background: #fafafa;
      transition: border-color .2s;
    }
    .input-wrap:focus-within { border-color: #2563eb; background: #fff; }
    .input-wrap svg { color: #aaa; flex-shrink: 0; }
    .input-wrap input {
      flex: 1; border: none; background: transparent;
      font-size: .92rem; outline: none; color: #1a1a2e;
    }
    .input-wrap input::placeholder { color: #bbb; }

    /* Turnstile widget container */
    .turnstile-wrap {
      margin: 16px 0;
      min-height: 65px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    /* Button */
    .btn-submit {
      width: 100%; padding: 15px;
      background: #2563eb;
      color: #fff; border: none; border-radius: 50px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all .2s;
    }
    .btn-submit:hover:not(:disabled) { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 4px 16px rgba(37,99,235,.35); }
    .btn-submit:disabled { opacity: .6; cursor: wait; }

    /* Spinner */
    .spinner {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Result card */
    .result-card { display: none; }
    .result-card.show { display: block; }

    .result-header {
      display: inline-flex; align-items: center; gap: 6px;
      background: #f0fdf4; color: #16a34a;
      border-radius: 50px; padding: 5px 12px;
      font-size: .8rem; font-weight: 700; margin-bottom: 16px;
    }
    .result-header.error { background: #fef2f2; color: #dc2626; }

    .result-box {
      background: #f8fafc; border: 1.5px solid #e5e7eb;
      border-radius: 14px; padding: 18px 20px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .result-box-inner { }
    .result-box-label {
      font-size: .72rem; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: #888; margin-bottom: 8px;
    }
    .result-code {
      font-size: 2.2rem; font-weight: 900; letter-spacing: .15em; color: #2563eb;
    }
    .result-link {
      font-size: .88rem; color: #2563eb; word-break: break-all; margin-top: 8px;
    }
    .result-link a { color: #2563eb; text-decoration: underline; }
    .result-full {
      font-size: .82rem; color: #555; margin-top: 6px;
    }
    .btn-copy {
      background: #f4f6fb; border: 1.5px solid #e5e7eb;
      color: #333; padding: 8px 14px; border-radius: 8px;
      font-size: .8rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: all .15s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-copy:hover { background: #e5e7eb; }
    .btn-copy.copied { background: #f0fdf4; color: #16a34a; border-color: #bbf7d0; }

    .result-meta {
      display: flex; justify-content: space-between;
      font-size: .78rem; color: #aaa; margin-top: 6px;
      padding: 0 4px;
    }

    /* Error */
    .error-msg { font-size: .85rem; color: #dc2626; margin-top: 8px; display: none; }

    /* Multiple results */
    .emails-list { display: flex; flex-direction: column; gap: 8px; }
    .email-item {
      background: #f8fafc; border: 1.5px solid #e5e7eb;
      border-radius: 12px; padding: 14px 16px;
    }
    .email-item-subject { font-size: .85rem; font-weight: 600; color: #333; margin-bottom: 4px; }
    .email-item-code { font-size: 1.5rem; font-weight: 900; color: #2563eb; letter-spacing: .1em; margin: 6px 0; }
    .email-item-from { font-size: .75rem; color: #888; }
    .email-item-time { font-size: .72rem; color: #aaa; margin-top: 4px; }

    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 4px 4px; max-width: 500px; width: 100%; margin: 0 auto;
    }
    .top-nav .logo { font-size: 1rem; font-weight: 800; color: #1a1a2e; text-decoration: none; }
    .top-nav .logo span { color: #e50914; }
    .top-nav-links { display: flex; gap: 6px; flex-wrap: wrap; }
    .top-nav-links a {
      font-size: .78rem; font-weight: 600; color: #555; text-decoration: none;
      padding: 6px 12px; border-radius: 20px; border: 1px solid #e5e7eb; background: #fff;
    }
    .top-nav-links a:hover { color: #2563eb; border-color: #2563eb; }
    .top-nav-links a.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  </style>
</head>
<body>

<header class="top-nav">
  <a href="/" class="logo"><span>N</span> Get Netflix Code</a>
  <nav class="top-nav-links">
    <a href="/" class="active">Get code</a>
    <a href="/seller">Seller</a>
    <a href="/admin">Admin</a>
  </nav>
</header>

<div class="page">

  <!-- Input Card -->
  <div class="card">
    <h1>Get Netflix Code</h1>
    <p class="subtitle">Enter your <strong>email</strong> or <strong>key</strong> to get your Netflix login code, household code, or password reset link.</p>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" id="tabEmail" onclick="switchTab('email')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        By email
      </button>
      <button class="tab" id="tabKey" onclick="switchTab('key')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3"/></svg>
        By key
      </button>
    </div>

    <!-- Email input -->
    <div id="fieldEmail">
      <div class="field-label">Email address</div>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
        <input id="inputEmail" type="email" placeholder="netflix@example.com" />
      </div>
    </div>

    <!-- Key input -->
    <div id="fieldKey" style="display:none">
      <div class="field-label">Key</div>
      <div class="input-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3"/></svg>
        <input id="inputKey" type="text" placeholder="SK-XXXXXXXX-XXXXXXXX-XXXXXXXX" />
      </div>
    </div>

    <!-- Cloudflare Turnstile (thật) -->
    <div class="turnstile-wrap" id="turnstileWrap"></div>

    <div class="error-msg" id="errorMsg"></div>

    <button class="btn-submit" id="btnSubmit" onclick="fetchCode()" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Get code
    </button>
  </div>

  <!-- Result Card -->
  <div class="card result-card" id="resultCard">
    <div id="resultHeader" class="result-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      Email found
    </div>
    <div id="resultContent"></div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
let mode = 'email'; // 'email' | 'key'
let turnstileToken = null;
let turnstileWidgetId = null;
let turnstileEnabled = true;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.async = true;
    s.defer = true;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

function updateSubmitState() {
  const btn = document.getElementById('btnSubmit');
  btn.disabled = turnstileEnabled && !turnstileToken;
}

function resetTurnstile() {
  turnstileToken = null;
  if (turnstileWidgetId != null && window.turnstile) {
    try { turnstile.reset(turnstileWidgetId); } catch { /* ignore */ }
  }
  updateSubmitState();
}

async function initTurnstile() {
  try {
    const cfg = await fetch('/api/turnstile/config').then(r => r.json());
    turnstileEnabled = !!cfg.enabled;

    if (!turnstileEnabled) {
      document.getElementById('turnstileWrap').style.display = 'none';
      turnstileToken = 'disabled';
      updateSubmitState();
      return;
    }

    await loadScript('https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit');
    turnstileWidgetId = turnstile.render('#turnstileWrap', {
      sitekey: cfg.siteKey,
      theme: 'light',
      callback(token) {
        turnstileToken = token;
        updateSubmitState();
      },
      'expired-callback': resetTurnstile,
      'error-callback': resetTurnstile,
    });
  } catch (e) {
    showError('Could not load Cloudflare Turnstile: ' + e.message);
  }
}

initTurnstile();

// Key → email mapping (stored in localStorage for persistence)
function saveKey(key, email) {
  const keys = JSON.parse(localStorage.getItem('mailKeys') || '{}');
  keys[key] = email;
  localStorage.setItem('mailKeys', JSON.stringify(keys));
}
function resolveKey(key) {
  const keys = JSON.parse(localStorage.getItem('mailKeys') || '{}');
  return keys[key] || null;
}
let keyPermissions = null;
let activeKeyStr = '';

async function resolveKeyServer(key) {
  try {
    const r = await fetch('/api/key/resolve?key=' + encodeURIComponent(key));
    if (!r.ok) return null;
    const d = await r.json();
    if (!d.success) return null;
    keyPermissions = d.permissions || null;
    return d.email;
  } catch { return null; }
}
function generateKey() {
  const rand = () => Math.random().toString(36).substring(2, 10).toUpperCase();
  return `SK-${rand()}-${rand()}-${rand()}`;
}

// ── Tab switch ─────────────────────────────────────────────────────────────────
function switchTab(t) {
  mode = t;
  document.getElementById('tabEmail').classList.toggle('active', t === 'email');
  document.getElementById('tabKey').classList.toggle('active', t === 'key');
  document.getElementById('fieldEmail').style.display = t === 'email' ? '' : 'none';
  document.getElementById('fieldKey').style.display   = t === 'key'   ? '' : 'none';
  hideResult(); hideError();
}

// ── Main logic ─────────────────────────────────────────────────────────────────
async function fetchCode() {
  hideResult(); hideError();
  const btn = document.getElementById('btnSubmit');

  let emailAddr = '';

  if (mode === 'email') {
    emailAddr = document.getElementById('inputEmail').value.trim();
    if (!emailAddr || !emailAddr.includes('@')) {
      showError('Please enter a valid email address.');
      return;
    }
  } else {
    const key = document.getElementById('inputKey').value.trim();
    if (!key) { showError('Please enter a key.'); return; }
    activeKeyStr = key;
    keyPermissions = null;
    emailAddr = await resolveKeyServer(key) || resolveKey(key);
    if (!emailAddr) {
      showError('Invalid key or key not registered.');
      return;
    }
    if (!keyPermissions && emailAddr) {
      keyPermissions = { permLogin: true, permReset: true, permFamily: true };
    }
  }

  if (turnstileEnabled && !turnstileToken) {
    showError('Please complete the Cloudflare verification.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Searching...';

  try {
    const [user, domain] = emailAddr.split('@');
    if (!user || !domain) throw new Error('Invalid email');

    const payload = { email: emailAddr, turnstileToken: turnstileToken };
    if (mode === 'key' && activeKeyStr) payload.key = activeKeyStr;

    const resp = await fetch('/api/inbox', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const data = await resp.json();

    if (!data.success) throw new Error(data.error || 'Could not retrieve email');

    const perms = data.permissions || keyPermissions;
    displayResult(data.emails, emailAddr, perms);
  } catch (e) {
    showError('Error: ' + e.message);
  } finally {
    resetTurnstile();
    btn.innerHTML = `
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      Get code`;
  }
}

// ── Display results ────────────────────────────────────────────────────────────
function displayResult(emails, emailAddr, perms) {
  const card    = document.getElementById('resultCard');
  const header  = document.getElementById('resultHeader');
  const content = document.getElementById('resultContent');

  if (!emails.length) {
    header.className = 'result-header error';
    header.innerHTML = '✕ No matching code found';
    let hint = `Inbox <strong>${emailAddr}</strong> is empty or has no Netflix email yet.`;
    if (perms && !perms.permFamily && mode === 'key') {
      hint += '<br><span style="color:#c9a227">This key does not have permission to view the household code — contact your seller.</span>';
    }
    content.innerHTML = `<p style="font-size:.85rem;color:#888;">${hint}<br>Please try again in a few seconds.</p>`;
    card.classList.add('show');
    return;
  }

  header.className = 'result-header';
  header.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg> Found ${emails.length} email(s)`;

  // Show most relevant first (Netflix code emails)
  const html = emails.map(email => buildEmailItem(email, perms)).join('');
  content.innerHTML = `<div class="emails-list">${html}</div>`;
  card.classList.add('show');
}

function buildEmailItem(email, perms) {
  const p = perms || { permLogin: true, permReset: true, permFamily: true };
  const code     = p.permLogin ? (email.extracted_code || '') : '';
  const resetLink= p.permReset ? (email.reset_link || '') : '';
  const fam      = p.permFamily ? (email.family_code || '') : '';
  const time     = email.time ? new Date(email.time).toLocaleString('vi-VN') : '';

  let bodyHtml = '';

  if (code) {
    bodyHtml = `
      <div class="result-box">
        <div class="result-box-inner">
          <div class="result-box-label">Login code</div>
          <div class="result-code">${code.split('').join(' ')}</div>
        </div>
        <button class="btn-copy" onclick="copyText('${code}', this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copy
        </button>
      </div>`;
  } else if (resetLink) {
    bodyHtml = `
      <div class="result-box" style="flex-direction:column;align-items:flex-start;gap:10px;">
        <div class="result-box-label">Password reset link</div>
        <div class="result-link"><a href="${escHtml(resetLink)}" target="_blank">${escHtml(resetLink.substring(0,60))}…</a></div>
        <button class="btn-copy" onclick="copyText('${escHtml(resetLink)}', this)" style="align-self:flex-end">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copy link
        </button>
      </div>`;
  } else if (fam) {
    bodyHtml = `
      <div class="result-box">
        <div class="result-box-inner">
          <div class="result-box-label">Household code</div>
          <div class="result-code" style="font-size:1.5rem">${fam}</div>
        </div>
        <button class="btn-copy" onclick="copyText('${fam}', this)">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          Copy
        </button>
      </div>`;
  } else {
    bodyHtml = `<p class="result-full">${escHtml(email.subject)}</p>`;
  }

  return `
    <div class="email-item">
      ${bodyHtml}
      <div class="result-meta">
        <span>${time}</span>
        <span>${escHtml(email.from || '')}</span>
      </div>
    </div>`;
}

// ── Utils ──────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function copyText(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    const orig = btn.innerHTML;
    btn.textContent = '✓ Copied';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
  } catch { alert('Copy manually: ' + text); }
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() { document.getElementById('errorMsg').style.display = 'none'; }
function hideResult() {
  document.getElementById('resultCard').classList.remove('show');
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') fetchCode();
});
</script>
</body>
</html>
